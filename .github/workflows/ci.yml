name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verifier:
    name: Build, docs générées, secrets, liens
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Node
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: parcours-acs/package-lock.json

      - name: Installe les dépendances
        working-directory: parcours-acs
        run: npm ci

      - name: Build (inclut gen-lexique + sync-docs)
        working-directory: parcours-acs
        run: npm run build

      - name: Doc générée à jour (échoue si gen-lexique/sync-docs n'a pas été commité)
        run: |
          if ! git diff --quiet -- parcours-acs/LEXIQUE.md parcours-acs/public/docs; then
            echo "::error::LEXIQUE.md ou public/docs/ n'est pas à jour — lance npm run build en local et commite le résultat."
            git diff --stat -- parcours-acs/LEXIQUE.md parcours-acs/public/docs
            exit 1
          fi

      - name: Corpus synchronisé vers acs-dev-guard/references (source unique)
        run: node scripts/sync-references.mjs --check

      - name: Scan de secrets (gitleaks)
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Liens internes morts (corpus)
        run: node scripts/check-liens.mjs

  deploy:
    name: Déploiement GitHub Pages
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: verifier
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploiement.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Node
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: parcours-acs/package-lock.json

      - name: Installe les dépendances
        working-directory: parcours-acs
        run: npm ci

      - name: Build
        working-directory: parcours-acs
        run: npm run build

      - name: Configure Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5.0.0

      - name: Upload artefact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: parcours-acs/dist

      - name: Déploiement
        id: deploiement
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
